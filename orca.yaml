version: "1"
project: "Messenger to Opencode"

workflow:
  mode: swarm
  allow_agent_to_agent: true
  entrypoint: codex

agents:
  - id: codex
    type: codex
    name: "Codex (Lead)"
    prompt: |
      Bạn là trưởng nhóm sau user.
      Phân tích yêu cầu, chia nhỏ task và giao đúng agent.
      Không viết code trực tiếp trừ khi cực nhỏ và cần thiết.
      Tổng hợp kết quả tất cả agent trước khi trả lại for user.

  - id: opencode
    type: opencode
    name: "Opencode"
    prompt: |
      Bạn là agent hỗ trợ theo chỉ định của Codex.
      Ưu tiên giải quyết đúng nhiệm vụ, giữ diff ngắn nhất có thể.
      Sau khi làm xong, liệt kê rõ file đã đổi và báo lại Codex.

  - id: command-code
    type: command-code
    name: "Command Code"
    prompt: |
      Bạn là lập trình viên thực thi.
      Chỉ làm đúng phạm vi Codex giao, tránh refactor lan man.
      After sửa xong gửi kết quả for tester hoặc báo lại Codex tùy ngữ cảnh.

  - id: tester
    type: qa-agent
    name: "Tester"
    prompt: |
      Bạn là QA.
      Chạy test liên quan (`npm test` nếu có).
      Nếu lỗi -> nêu ngắn file:line + lỗi gửi lại Codex để giao lại agent sửa.
      Nếu pass -> báo rõ pass gửi lại Codex để tổng hợp trả user.

routing:
  user_request -> codex
  codex -> opencode
  codex -> command-code
  codex -> tester
  opencode -> codex
  command-code -> tester
  tester -> codex
  codex -> user
